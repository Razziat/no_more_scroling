name: Android release

on:
  push:
    tags:
      - "android-v*"

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build signed Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/android

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Check tag and application version
        shell: bash
        run: |
          app_version="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          if [[ -z "$app_version" ]]; then
            echo "::error::Unable to read versionName from app/build.gradle.kts"
            exit 1
          fi
          if [[ "$GITHUB_REF_NAME" != "android-v$app_version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $app_version"
            exit 1
          fi

      - name: Check signing secrets
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          for variable_name in \
            ANDROID_RELEASE_KEYSTORE_BASE64 \
            ANDROID_RELEASE_STORE_PASSWORD \
            ANDROID_RELEASE_KEY_ALIAS \
            ANDROID_RELEASE_KEY_PASSWORD
          do
            if [[ -z "${!variable_name:-}" ]]; then
              echo "::error::Missing GitHub Actions secret: $variable_name"
              exit 1
            fi
          done

      - name: Restore release keystore
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/anti-scroll-release.jks"

      - name: Test, lint and build signed release
        shell: bash
        env:
          ANDROID_RELEASE_STORE_FILE: ${{ runner.temp }}/anti-scroll-release.jks
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: >-
          ./gradlew
          --no-daemon
          --no-configuration-cache
          testDebugUnitTest
          lintRelease
          assembleRelease

      - name: Verify APK signature and prepare assets
        shell: bash
        run: |
          build_tools_dir="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          apk_source="app/build/outputs/apk/release/app-release.apk"
          artifact_dir="$RUNNER_TEMP/android-release-assets"
          artifact_name="anti-scroll-android-${GITHUB_REF_NAME#android-v}.apk"

          if [[ ! -f "$apk_source" ]]; then
            echo "::error::Release APK was not generated"
            exit 1
          fi
          "$build_tools_dir/apksigner" verify --verbose --print-certs "$apk_source"

          mkdir -p "$artifact_dir"
          cp "$apk_source" "$artifact_dir/$artifact_name"
          cd "$artifact_dir"
          sha256sum "$artifact_name" > SHA256SUMS.txt

      - name: Create or update draft GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact_dir="$RUNNER_TEMP/android-release-assets"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$artifact_dir"/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              "$artifact_dir"/* \
              --draft \
              --generate-notes \
              --title "Anti Scroll Android v${GITHUB_REF_NAME#android-v}" \
              --verify-tag
          fi
